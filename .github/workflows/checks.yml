name: Platform checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - run: npm ci
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python evaluation/run.py
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run test:e2e
        working-directory: apps/admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/admin/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant_test -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://assistant_test:synthetic-ci-only-password@127.0.0.1:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - run: pytest -q
