name: Platform checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - run: npm ci
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
      - run: npx tsc -p ../../packages/react-sdk/tsconfig.json
        working-directory: apps/admin
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python evaluation/run.py
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run test:e2e
        working-directory: apps/admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/admin/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant_test -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://assistant_test:synthetic-ci-only-password@127.0.0.1:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - run: pytest -q
  local-model-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_EMBED_MODEL: all-minilm:latest
      POSTGRES_PASSWORD: synthetic-ci-compose-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: docker run -d --name model-smoke -p 127.0.0.1:11434:11434 ollama/ollama:0.11.4
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags; then break; fi
            sleep 1
          done
          docker exec model-smoke ollama pull smollm2:135m
          docker exec model-smoke ollama pull smollm2:360m
          docker exec model-smoke ollama pull all-minilm:latest
      - run: python evaluation/local_model_smoke.py
      - run: docker rm -f model-smoke
      - name: First-run installer with actual local models
        run: |
          printf '%s\n' 'synthetic-installer-owner-password' | python scripts/setup.py --domain '' --provider ollama --owner-email owner@setup.example.test --organization 'Installer test' --password-stdin --no-browser
      - name: Installer rerun preserves existing accounts and database credentials
        run: python scripts/setup.py --no-browser
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e APP_DOMAIN=chat.example.test -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: always()
        run: docker compose logs --tail=60 && docker compose down -v
