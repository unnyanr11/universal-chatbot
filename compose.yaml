services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U assistant -d assistant]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD}@db/assistant
      APP_ENV: development
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
    command: [python, -m, platform_api.migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: *api-env
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: *api-env
    command: [python, -m, platform_api.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - models:/root/.ollama
    # Intentionally no host port; inference is not a public API.
volumes:
  database:
  models:
